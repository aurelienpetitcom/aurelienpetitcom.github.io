<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Discover Aurélien Petit, industrial electromechanical engineer and creator."
        data-i18n-content="about.description">
    <title data-i18n="about.title">About — Aurélien Petit</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="page-transition.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="about-page" data-site-root=".">
    <header class="site-header" data-site-header></header>

    <main class="about-main" id="about">
        <section class="about-intro" aria-labelledby="about-title">
            <h1 id="about-title" data-i18n="about.heading">About</h1>
            <p class="about-name">Aurélien Petit</p>
            <div class="about-social-links">
                <a href="https://www.instagram.com/ap.aurelienpetit/" target="_blank" rel="noopener noreferrer">
                    Instagram <span aria-hidden="true">↗</span>
                </a>
                <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">
                    LinkedIn <span aria-hidden="true">↗</span>
                </a>
            </div>
            <p class="about-description" data-i18n="about.introduction"></p>
        </section>

        <section class="about-resume" aria-label="Résumé">
            <figure class="about-cv">
                <img data-about-cv-image src="assets/images/about/cv_aurelien_petit_06_10_26_en.png"
                    alt="Aurélien Petit’s résumé" width="1200" height="1697" data-i18n-alt="about.imageAlt">
            </figure>
            <div class="about-download-row">
                <a class="about-download" data-about-cv-download
                    href="assets/fichiers/about/cv_aurelien_petit_06_10_26_en.pdf"
                    download="cv_aurelien_petit_06_10_26_en.pdf">
                    <span data-i18n="about.download">Download PDF</span>
                </a>
                <span class="about-file-size" data-about-cv-size>529 ko</span>
            </div>
        </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
    <script src="site-data.js"></script>
    <script src="script.js"></script>
</body>

</html>
