<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Discover the creative productions of Aurélien Petit."
        data-i18n-content="site.description">
    <title data-i18n="site.homeTitle">Aurélien Petit</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="page-transition.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="home-page" data-site-root=".">
    <header class="site-header" data-site-header></header>

    <main class="home-productions" id="productions">
        <article class="home-production home-production-1" data-production-id="journey"
            aria-labelledby="production-1-title">
            <div class="home-production-copy">
                <p class="content-title" id="production-1-title">Journey to the Moon</p>
                <img class="home-production-logo" src="assets/images/journey-to-the-moon/journey-to-the-moon-logo.png"
                    alt="" width="1110" height="400">
                <div class="home-production-actions">
                    <p class="home-production-date" data-release-date="journey"></p>
                    <a class="home-production-link" data-production-link="page" data-i18n="button.learnMore"></a>
                </div>
            </div>
            <a class="home-production-artwork" data-production-link="page" data-i18n-aria-label="home.discoverJourney">
                <img src="assets/images/journey-to-the-moon/journey-to-the-moon-1.png" data-i18n-alt="image.journey"
                    alt="Illustration of the Journey to the Moon spaceship" width="1500" height="1108">
            </a>
            <a class="home-production-card-link" data-production-link="page"
                data-i18n-aria-label="home.discoverJourney"></a>
        </article>

        <article class="home-production-left home-production-2" data-production-id="famousCastle"
            aria-labelledby="production-2-title">
            <div class="home-production-copy">
                <p class="content-title" id="production-2-title">Famous Castle</p>
                <img class="home-production-logo" src="assets/images/famous-castle/famous-castle-logo.png" alt=""
                    width="1386" height="400">
                <div class="home-production-actions">
                    <p class="home-production-date" data-release-date="famousCastle"></p>
                    <a class="home-production-link" data-production-link="page" data-i18n="button.learnMore"></a>
                </div>
            </div>
            <a class="home-production-artwork" data-production-link="page" data-i18n-aria-label="home.discoverCastle">
                <img src="assets/images/famous-castle/famous-castle-1.png" data-i18n-alt="image.castle"
                    alt="Night-time illustration of a castle" width="1000" height="1156">
            </a>
            <a class="home-production-card-link" data-production-link="page"
                data-i18n-aria-label="home.discoverCastle"></a>
        </article>

        <article class="home-production home-production-3" data-production-id="mecalodon"
            aria-labelledby="production-3-title">
            <div class="home-production-copy">
                <p class="content-title" id="production-3-title">Mecalodon Aquatic Show</p>
                <img class="home-production-logo"
                    src="assets/images/mecalodon-aquatic-show/mecalodon-aquatic-show-logo.png" alt="" width="1602"
                    height="400">
                <div class="home-production-actions">
                    <p class="home-production-date" data-release-date="mecalodon"></p>
                    <a class="home-production-link" data-production-link="instagram"
                        data-i18n-aria-label="home.viewMecalodon">
                        <span data-i18n="button.instagram"></span><span aria-hidden="true">↗</span>
                    </a>
                </div>
            </div>
            <a class="home-production-artwork" data-production-link="instagram"
                data-i18n-aria-label="home.viewMecalodon">
                <img src="assets/images/mecalodon-aquatic-show/mecalodon-aquatic-show-1.png"
                    data-i18n-alt="image.mecalodon" alt="Illustration of the Mecalodon Aquatic Show attraction"
                    width="1500" height="1108">
            </a>
            <a class="home-production-card-link" data-production-link="instagram"
                data-i18n-aria-label="home.viewMecalodon"></a>
            <nav class="home-quick-links" aria-label="Quick links" data-i18n-aria-label="search.quickLinks">
                <h2 data-i18n="home.quickLinks"></h2>
                <div>
                    <a class="home-production-link" href="mailto:contact@aurelienpetit.com" data-i18n="home.review"></a>
                    <a class="home-production-link" href="#about" data-i18n="home.about"></a>
                </div>
            </nav>
        </article>
    </main>

    <footer class="site-footer" id="about" data-site-footer></footer>
    <script src="site-data.js"></script>
    <script src="script.js"></script>
</body>

</html>
