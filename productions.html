<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore Aurélien Petit’s productions by year."
        data-i18n-content="site.archiveDescription">
    <title data-i18n="site.archiveTitle">Productions — Aurélien Petit</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="page-transition.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="productions-page" data-site-root=".">
    <header class="site-header" data-site-header></header>

    <main>
        <header class="production-explorer">
            <h1 data-i18n="productions.title">Explore per year</h1>
            <div class="production-year-filter" role="group" data-i18n-aria-label="productions.filter">
                <span class="production-year-filter-indicator" aria-hidden="true"></span>
                <button type="button" data-year="2025-2026" aria-pressed="true">2025-2026</button>
                <button type="button" data-year="2021" aria-pressed="false">2021</button>
                <button type="button" data-year="2020" aria-pressed="false">2020</button>
            </div>
        </header>

        <section class="home-productions production-year-items" id="productions"
            data-i18n-aria-label="productions.list" aria-label="Productions">
            <article class="home-production home-production-1" id="production-journey" data-production-id="journey" data-year="2025-2026"
                aria-labelledby="production-2025-1-title">
                <div class="home-production-copy">
                    <p class="content-title" id="production-2025-1-title">Journey to the Moon</p>
                    <img class="home-production-logo"
                        src="assets/images/journey-to-the-moon/journey-to-the-moon-logo.png" alt="" width="1110"
                        height="400">
                    <div class="home-production-actions">
                        <p class="home-production-date" data-release-date="journey"></p>
                        <a class="home-production-link" data-production-link="page"
                            data-i18n="button.learnMore"></a>
                    </div>
                </div>
                <a class="home-production-artwork" data-production-link="page"
                    data-i18n-aria-label="home.discoverJourney">
                    <img src="assets/images/journey-to-the-moon/journey-to-the-moon-1.png"
                        data-i18n-alt="image.journey" alt="Illustration of the Journey to the Moon spaceship"
                        width="1500" height="1108">
                </a>
                <a class="home-production-card-link" data-production-link="page"
                    data-i18n-aria-label="home.discoverJourney"></a>
            </article>

            <article class="home-production-left home-production-2" id="production-famousCastle" data-production-id="famousCastle"

                    <img class="home-production-logo" src="assets/images/famous-castle/famous-castle-logo.png" alt=""

                <a class="home-production-artwork" data-production-link="page"
                    data-i18n-aria-label="home.discoverCastle">
                    <img src="assets/images/famous-castle/famous-castle-1.png" data-i18n-alt="image.castle"

                    data-i18n-aria-label="home.discoverCastle"></a>
