<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Discover a reimagined castle in a unique style, where the Okbots seem ready to reach the summit."
    data-i18n-content="castle.metaDescription">
  <title data-i18n="castle.pageTitle">Famous Castle — Aurélien Petit</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <script src="../page-transition.js"></script>
  <link rel="stylesheet" href="../style.css">
</head>

<body class="production-page famous-castle-page" data-site-root=".." data-production-page="famousCastle">
  <header class="site-header" data-site-header></header>

  <main>
    <section class="production-hero" aria-labelledby="production-title">
      <div class="production-stage">
        <div class="production-sticky-range">
          <div class="production-lockup">
            <p class="content-title" data-i18n="castle.title"></p>
            <h1 class="production-logo" id="production-title">
              <img src="../assets/images/famous-castle/famous-castle-logo.png" data-i18n-alt="image.castleLogo"
                alt="Famous Castle" width="1386" height="400">
            </h1>
          </div>
          <div class="production-half-image-space" aria-hidden="true"></div>
          <div class="production-lockup-space" aria-hidden="true"></div>
        </div>
        <figure class="hero-artwork">
          <img src="../assets/images/famous-castle/famous-castle-1.png"
            data-i18n-alt="image.castleHero" alt="A detailed castle rises beneath a starry night sky" width="1000"
            height="1156" fetchpriority="high">
        </figure>
      </div>
      <div class="hero-intro">
        <p class="content-title" data-i18n="castle.title"></p>
        <p class="hero-tagline">
          <span data-i18n="castle.heroOne"></span>
          <strong data-i18n="castle.heroTwo"></strong>
        </p>
        <div class="hero-actions">
          <p class="release-date" data-release-date="famousCastle"></p>
          <div class="social-links" data-i18n-aria-label="social.follow">
            <a data-production-instagram="famousCastle"><span data-i18n="button.instagram"></span> <span
                aria-hidden="true">↗</span></a>
          </div>
        </div>
      </div>
    </section>

    <section class="section-details-1" aria-labelledby="details-title">
      <div class="section-details-1-composition" role="group"
        data-i18n-aria-label="image.castleDetails"
        aria-label="Three close-up details from the Famous Castle illustration">
        <img class="section-details-1-background" src="../assets/images/famous-castle/famous-castle-2.png" alt=""
          width="500" height="755" aria-hidden="true">
        <img class="section-details-1-image section-details-1-image-left"
          src="../assets/images/famous-castle/famous-castle-2a.png" data-i18n-alt="image.castleTowers"
          alt="Close-up of the castle's lower towers" width="500" height="755"
          style="top: 52.8%; left: 40.8%; width: 35%;">
        <img class="section-details-1-image section-details-1-image-right"
          src="../assets/images/famous-castle/famous-castle-2c.png" data-i18n-alt="image.castleClockTower"
          alt="Close-up of the castle's central clock tower" width="500" height="755"
          style="top: 37.1%; left: 13%; width: 35%;">
        <img class="section-details-1-image section-details-1-image-center"
          src="../assets/images/famous-castle/famous-castle-2b.png" data-i18n-alt="image.castleArchitecture"
          alt="Close-up of the castle's ornate architecture" width="500" height="755"
          style="top: 6.5%; left: 29.7%; width: 35%;">
      </div>
      <div class="section-copy section-details-1-copy">
        <p class="content-title" id="details-title" data-i18n="castle.detailsTitle"></p>
        <p class="content-description" data-i18n="castle.detailsDescription"></p>
      </div>
    </section>

    <section class="section-timelapse-1" aria-labelledby="timelapse-title">
      <div class="section-timelapse-1-artwork">
        <img src="../assets/images/famous-castle/famous-castle-3.png"
          data-i18n-alt="image.castleTimelapse"
          alt="A close-up of the castle illustration, showing its fine architectural details" width="800"
          height="499">
      </div>
      <div class="section-timelapse-1-copy">
        <h2 id="timelapse-title"><strong>Time-lapse</strong> <span data-i18n="castle.timelapse"></span></h2>
        <div class="social-links" data-i18n-aria-label="social.watch">
          <a data-production-timelapse="famousCastle"><span data-i18n="button.instagram"></span> <span
              aria-hidden="true">↗</span></a>
          <a href="https://www.youtube.com/watch?v=Cd-SHJ2TamQ" target="_blank" rel="noopener noreferrer">YouTube <span
              aria-hidden="true">↗</span></a>
        </div>
      </div>
    </section>

    <section class="section-comments-1" id="about" aria-labelledby="comments-title"
      data-comments-section></section>
  </main>

  <footer class="site-footer" data-site-footer></footer>
  <script src="../site-data.js"></script>
  <script src="../script.js"></script>
</body>

</html>
