<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Journey to the Moon: embark on a journey aboard the legendary spaceship bound for the Moon."
    data-i18n-content="journey.metaDescription">
  <title data-i18n="journey.pageTitle">Journey to the Moon — Aurélien Petit</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <script src="../page-transition.js"></script>
  <link rel="stylesheet" href="../style.css">
</head>

<body class="production-page" data-site-root=".." data-production-page="journey">
  <header class="site-header" data-site-header></header>

  <main>
    <section class="production-hero" aria-labelledby="production-title">
      <div class="production-stage">
        <div class="production-sticky-range">
          <div class="production-lockup">
            <p class="content-title" data-i18n="journey.title"></p>
            <h1 class="production-logo" id="production-title">
              <img src="../assets/images/journey-to-the-moon/journey-to-the-moon-logo.png"
                data-i18n-alt="image.journeyLogo" alt="Journey to the Moon — spaceship and lettering"
                width="2775" height="1001">
            </h1>
          </div>
          <div class="production-half-image-space" aria-hidden="true"></div>
          <div class="production-lockup-space" aria-hidden="true"></div>
        </div>
        <figure class="hero-artwork">
          <img src="../assets/images/journey-to-the-moon/journey-to-the-moon-1.png"
            data-i18n-alt="image.journeyHero" alt="The legendary spaceship, drawn in intricate black and white detail"
            width="3810" height="2814" fetchpriority="high">
        </figure>
      </div>
      <div class="hero-intro">
        <p class="content-title">Journey to the Moon</p>
        <p class="hero-tagline">
          <span data-i18n="journey.heroOne"></span>
          <span data-i18n="journey.heroTwo"></span>
          <strong data-i18n="journey.heroThree"></strong>
        </p>
        <div class="hero-actions">
          <p class="release-date" data-release-date="journey"></p>
          <div class="social-links" data-i18n-aria-label="social.follow">
            <a data-production-instagram="journey"><span data-i18n="button.instagram"></span> <span
                aria-hidden="true">↗</span></a>
          </div>
        </div>
      </div>
    </section>

    <section class="section-details-1" aria-labelledby="details-title">
      <div class="section-details-1-composition" role="group"
        data-i18n-aria-label="image.journeyDetails" aria-label="Three details over the spaceship illustration">
        <img class="section-details-1-background" src="../assets/images/journey-to-the-moon/journey-to-the-moon-2.png"
          alt="" width="4013" height="4066" aria-hidden="true">
        <img class="section-details-1-image section-details-1-image-left"
          src="../assets/images/journey-to-the-moon/journey-to-the-moon-2a.png"
          data-i18n-alt="image.journeyInterior" alt="Close-up of the spaceship's interior" width="1126" height="1699"
          style="top: 55.1%; left: 9.5%; width: 29%;">
        <img class="section-details-1-image section-details-1-image-center"
          src="../assets/images/journey-to-the-moon/journey-to-the-moon-2b.png"
          data-i18n-alt="image.journeyFramework" alt="Close-up of the spaceship's framework" width="1126"
          height="1699"
          style="top: 38.5%; left: 35.5%; width: 29%;">
        <img class="section-details-1-image section-details-1-image-right"
          src="../assets/images/journey-to-the-moon/journey-to-the-moon-2c.png"
          data-i18n-alt="image.journeyStructure" alt="Close-up of the spaceship's structure" width="1126"
          height="1699"
          style="top: 48%; left: 64%; width: 29%;">
      </div>
      <div class="section-copy section-details-1-copy">
        <p class="content-title" id="details-title" data-i18n="journey.detailsTitle"></p>

        <p class="content-description" data-i18n="journey.detailsDescription"></p>
      </div>
    </section>

    <section class="section-artwork-1" aria-labelledby="artwork-title">
      <div class="section-artwork-1-composition" aria-hidden="true">
        <img class="section-artwork-1-title-layer" src="../assets/images/journey-to-the-moon/journey-to-the-moon-3a.png"
          alt="" width="500" height="201">
        <img class="section-artwork-1-image-layer" src="../assets/images/journey-to-the-moon/journey-to-the-moon-3b.png"
          alt="" width="500" height="684">
      </div>
      <div class="section-artwork-1-content">
        <div class="section-copy section-artwork-1-copy">
          <p class="content-title" id="artwork-title" data-i18n="journey.destinationTitle"></p>
          <p class="content-description" data-i18n="journey.destinationDescription"></p>
        </div>
      </div>
    </section>

    <section class="section-timelapse-1" aria-labelledby="timelapse-title">
      <div class="section-timelapse-1-artwork">
        <img src="../assets/images/journey-to-the-moon/journey-to-the-moon-4.png" alt="" width="2829" height="1683"
          aria-hidden="true">
      </div>
      <div class="section-timelapse-1-copy">
        <h2 id="timelapse-title"><strong>Time-lapse</strong> <span data-i18n="journey.timelapse"></span></h2>
        <div class="social-links" data-i18n-aria-label="social.watch">
          <a data-production-timelapse="journey"><span data-i18n="button.instagram"></span> <span
              aria-hidden="true">↗</span></a>
          <a href="https://www.youtube.com/watch?v=DSK1pp9jjGE" target="_blank" rel="noopener noreferrer">YouTube <span
              aria-hidden="true">↗</span></a>
        </div>
      </div>
    </section>

    <section class="section-comments-1" id="about" aria-labelledby="comments-title"
      data-comments-section></section>
  </main>

  <footer class="site-footer" data-site-footer></footer>
  <script src="../site-data.js"></script>
  <script src="../script.js"></script>
</body>

</html>
